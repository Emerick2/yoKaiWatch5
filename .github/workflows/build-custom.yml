name: Build Custom AppImage

on:
  workflow_dispatch:
    inputs:
      appimage_name:
        description: 'Nom souhaite pour l AppImage'
        required: true
        default: 'ykw-5-v0.0.5'
        type: string

jobs:
  build-linux:
    name: Build for Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build Unity Project (StandaloneLinux64)
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: StandaloneLinux64
          projectPath: .

      - name: Preparer l'AppDir
        run: |
          APP_NAME="${{ inputs.appimage_name }}"

          mkdir -p build/AppDir/usr/bin
          mkdir -p build/AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p build/AppDir/usr/share/applications

          cp -r build/StandaloneLinux64/* build/AppDir/usr/bin/

          cd build/AppDir/usr/bin/
          MAIN_EXEC=$(find . -maxdepth 1 -type f ! -name "*.data" ! -name "*.so" ! -name "*.txt" | head -n 1)
          mv "$MAIN_EXEC" "$APP_NAME"
          chmod +x "$APP_NAME"
          cd -

          cat << EOF > build/AppDir/usr/share/applications/$APP_NAME.desktop
          [Desktop Entry]
          Type=Application
          Name=$APP_NAME
          Exec=$APP_NAME
          Icon=$APP_NAME
          Categories=Game;
          EOF

          ln -s usr/share/applications/$APP_NAME.desktop build/AppDir/$APP_NAME.desktop
          
          if [ -f "icon.png" ]; then
            cp icon.png build/AppDir/usr/share/icons/hicolor/256x256/apps/$APP_NAME.png
            ln -s usr/share/icons/hicolor/256x256/apps/$APP_NAME.png build/AppDir/.png
          fi

      - name: Télécharger et exécuter appimagetool
        run: |
          APP_NAME="${{ inputs.appimage_name }}"
          wget -O appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          
          export ARCH=x86_64
          ./appimagetool build/AppDir "$APP_NAME-x86_64.AppImage"

      - name: Sauvegarder l'AppImage (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.appimage_name }}-appimage
          path: ${{ inputs.appimage_name }}-x86_64.AppImage
